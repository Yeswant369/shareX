<!-- Split Layout Component (Mobile) -->
<section class="split-layout mobile-only">
    <div class="split-layout__panel split-layout__panel--top">
        <div class="split-layout__dots split-layout__dots--up"></div>
        <button class="split-layout__cta">
            <span class="split-layout__cta-label">SHARE</span>
            <span class="split-layout__cta-arrow">↑</span>
        </button>
    </div>
    <div class="split-layout__divider"></div>
    <div class="split-layout__panel split-layout__panel--bottom">
        <div class="split-layout__dots split-layout__dots--down"></div>
        <button class="split-layout__cta">
            <span class="split-layout__cta-label">RECEIVE</span>
            <span class="split-layout__cta-arrow">↓</span>
        </button>
    </div>
</section>
