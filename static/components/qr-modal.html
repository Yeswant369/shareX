<!-- QR Modal Component -->
<div class="modal" role="dialog" aria-label="QR Code">
    <div class="modal__backdrop"></div>
    <div class="modal__content">
        <button class="modal__close" aria-label="Close">✕</button>
        <div class="modal__body">
            <h2 class="modal__title">Scan to Connect</h2>
            <div class="modal__qr">
                <canvas></canvas>
            </div>
            <p class="modal__code">---</p>
            <p class="modal__hint">Or enter the code manually below</p>
        </div>
    </div>
</div>
